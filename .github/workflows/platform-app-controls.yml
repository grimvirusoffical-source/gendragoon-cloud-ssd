name: Platform app controls

on:
  push:
    branches: ['codex/platform-app-controls-*']
  pull_request:
    paths: ['native/Desktop/**', 'native/Extensions/**', 'native/Resources/gendragoon_native_bridge.py', '.github/workflows/platform-app-controls.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-controls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: python -m pip install --only-binary=:all: -r native/Desktop/requirements.txt
      - name: OS eligibility, broker identity and Stop consent regressions
        run: python -B -m unittest discover -s native/Desktop/tests -p test_app_controls.py -v
      - name: Real portable process-tree isolation on the target operating system
        run: python -B -m unittest discover -s native/Desktop/tests -p test_app_control_native.py -v
      - name: Native bridge rejects arbitrary commands, paths and PIDs
        run: python -B -m unittest native.Tests.test_native_bridge native.Tests.test_extension_packages -v
      - name: Browser detection and native messaging regressions
        run: node --test native/Extensions/tests/platform.test.cjs
