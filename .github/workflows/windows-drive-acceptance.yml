name: Actual Windows workspace drive acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/Desktop/**'
      - '.github/workflows/windows-drive-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: windows-drive-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actual-winfsp:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Require a disposable hosted Windows runner
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') {
            throw 'This driver fixture may run only on a disposable GitHub-hosted Windows runner.'
          }
      - name: Verify the official signed and checksum-pinned WinFsp CI prerequisite
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'gendragoon-ci-winfsp-2.1.25156.msi'
          if (Test-Path -LiteralPath $installer) { throw 'Fresh prerequisite path required' }
          Invoke-WebRequest -Uri 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($hash -ne '073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a' -or (Get-Item -LiteralPath $installer).Length -ne 2191360) {
            throw 'Official WinFsp package checksum or byte count differs'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid') { throw 'Official WinFsp Authenticode signature is not valid' }
          $result = Start-Process msiexec.exe -ArgumentList @('/i', "`"$installer`"", '/qn', '/norestart', 'ADDLOCAL=Core') -Wait -PassThru
          @{schema=1; officialRelease='https://github.com/winfsp/winfsp/releases/tag/v2.1'; sha256=$hash; bytes=2191360; signatureStatus=[string]$signature.Status; signer=$signature.SignerCertificate.Subject; installerExitCode=$result.ExitCode; ephemeralHostedRunner=$true} | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'ci-winfsp-install.json')
          if ($result.ExitCode -ne 0) { throw "The disposable WinFsp installation did not complete without reboot: $($result.ExitCode)" }
      - name: Stage the genuine compiled Windows codec and private UTF-8 interpreter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -B -m pip install --only-binary=:all: -r native/Desktop/requirements.txt -r native/Desktop/requirements-build.txt
          python -B native/Desktop/stage_runtime.py --destination "$env:RUNNER_TEMP/gendragoon-desktop" --prebuilt native/Desktop/runtimes/windows-x86_64.zip
          python -B native/Desktop/windows_utf8.py --destination "$env:RUNNER_TEMP/gendragoon-python-utf8" --path "$env:RUNNER_TEMP/gendragoon-desktop" --path "$env:RUNNER_TEMP/gendragoon-desktop/runtime"
          python -B native/Desktop/stage_ci_rclone.py --destination "$env:RUNNER_TEMP/gendragoon-rclone-fixture"
      - name: Require real mount, private descriptor, file read, busy refusal and normal unmount
        shell: pwsh
        env:
          GD_DESKTOP_RUNTIME: ${{ runner.temp }}/gendragoon-desktop
          GD_MOUNT_REPORT: ${{ runner.temp }}/desktop-mount-capabilities.json
        run: |
          & "$env:RUNNER_TEMP/gendragoon-python-utf8/python.exe" -B -m unittest discover -s native/Desktop/tests -p test_workspace_drives.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows drive tests failed' }
          $report = Get-Content -Raw -LiteralPath $env:GD_MOUNT_REPORT | ConvertFrom-Json
          if ($report.mount -ne 'verified') { throw 'Actual WinFsp mounting is mandatory in this workflow; a skip is not acceptance' }
      - name: Preserve sanitized driver installation and actual filesystem results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: GenDragoon-Windows-actual-WinFsp-drive
          path: |
            ${{ runner.temp }}/ci-winfsp-install.json
            ${{ runner.temp }}/desktop-mount-capabilities.json
          if-no-files-found: warn
