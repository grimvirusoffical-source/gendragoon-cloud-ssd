name: Native integration validation

on:
  push:
    branches: [codex/native-integration-20261017]
  pull_request:
    paths: ['native/**', 'macos/**', '.github/workflows/native-validation.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s native/Tests -p 'test_integrated_*.py'
        env:
          PYTHONPATH: native/Resources
      - run: python -m unittest discover -s native/Tests -p test_app_launch.py
      - run: python -m unittest discover -s native/Tests -p test_preload.py
      - name: Verify authenticated performance profiles and bounded tuning
        run: python -B -m unittest discover -s native/Tests -p test_performance_profiles.py
      - name: Verify complete project archives, restore checks and original-file safeguards
        run: python -B -m unittest discover -s native/Tests -p test_project_files.py
      - run: python -m unittest discover -s native/Tests -p test_smoke_macos_budget.py
      - run: python -m unittest discover -s native/Tests -p test_library_metadata.py
        env:
          PYTHONPATH: native/Resources
      - name: Verify read-only Darwin filesystem inventory and failure handling
        run: python -m unittest discover -s native/Tests -p test_darwin_mount_inventory.py
      - run: python native/Tests/stress_native.py
      - name: Test Mac notarization guardrails without Apple credentials
        run: python -m unittest discover -s native/Tests -p test_notarize_macos.py
      - name: Verify the Mac installer and reference update helpers
        run: python -m unittest discover -s macos/tests -p 'test_*.py'

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/Backend/package-lock.json
      - name: Install the real transfer-router fixture dependencies
        run: npm ci --ignore-scripts
        working-directory: native/Backend
      - name: Check protocol integration prerequisites
        run: node -e "require('./native/Backend/test_helpers/transfer_fixture')"
      - name: Test native lifecycle, archive security and the real v3 transfer router
        run: python -m unittest discover -s native/Desktop/tests -p test_desktop.py -v

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native/Backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/Backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: python3 -m unittest discover -p 'test_*.py'

  macos-compile:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compile all active native sources
        run: xcrun swiftc -parse-as-library -target arm64-apple-macosx14.0 -framework SwiftUI -framework AppKit -o "$RUNNER_TEMP/GenDragoon" native/Sources/*.swift
      - name: Execute native update activity and shared transfer budget regressions
        run: python3 -B -m unittest native.Tests.test_integrated_update_activity native.Tests.test_integrated_transfer_budget -v
      - name: Exercise actual Swift helper completion, failure, timeout and caller cancellation
        run: python3 -B -m unittest native.Tests.test_integrated_native_helper -v

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          gradle-version: '8.13'
      - name: Compile Android and run its configured unit tests
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --console=plain --stacktrace
        working-directory: native/Mobile/Android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Android-debug-candidate
          path: native/Mobile/Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Choose an available iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device.get("name",""):
                      print(f"udid={device['udid']}")
                      print(f"name={device['name']}")
                      sys.exit(0)
          sys.exit("no available iPhone simulator")
          PY
      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('native/Mobile/iOS/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project native/Mobile/iOS/GenDragoonMobile.xcodeproj -scheme GenDragoonMobile -derivedDataPath "$RUNNER_TEMP/GenDragoon-iOS"
      - name: Test iOS Simulator client
        env:
          IOS_SCREENSHOT_DIR: ${{ github.workspace }}/ios-screenshots
          TEST_RUNNER_IOS_SCREENSHOT_DIR: ${{ github.workspace }}/ios-screenshots
        run: xcodebuild test -project native/Mobile/iOS/GenDragoonMobile.xcodeproj -scheme GenDragoonMobile -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" -derivedDataPath "$RUNNER_TEMP/GenDragoon-iOS" CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES SWIFT_ENABLE_EXPLICIT_MODULES=NO
      - name: Collect simulator screenshots
        if: always()
        run: |
          mkdir -p ios-screenshots
          if [ -d /tmp/ios-screenshots ]; then cp -R /tmp/ios-screenshots/. ios-screenshots/; fi
          find ios-screenshots -name '*.png' | grep -q .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ios-simulator-screenshots
          path: ios-screenshots
          if-no-files-found: error
          retention-days: 7
