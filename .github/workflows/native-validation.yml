name: Native integration validation

on:
  push:
    branches:
      - codex/native-integration-20261017
      - fix/**
      - feat/**
      - test/**
  pull_request:
    paths: ['native/**', '!native/Mobile/Android/dependencies/**', 'macos/**', 'fixtures/**', '.github/workflows/native-validation.yml']
  workflow_dispatch:
    inputs:
      include_ios:
        description: 'Run iOS only after all other requested clients are finished and submitted'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s native/Tests -p 'test_integrated_*.py'
        env:
          PYTHONPATH: native/Resources
      - run: python -m unittest discover -s native/Tests -p test_app_launch.py
      - run: python -m unittest discover -s native/Tests -p test_preload.py
      - name: Verify authenticated performance profiles and bounded tuning
        run: python -B -m unittest discover -s native/Tests -p test_performance_profiles.py
      - name: Verify authenticated Red-XAI chunk transfer concurrency and resumable restoration
        run: python -B -m unittest discover -s native/Tests -p test_redx_transfer_performance.py
      - name: Verify complete project archives, restore checks and original-file safeguards
        run: python -B -m unittest discover -s native/Tests -p test_project_files.py
      - run: python -m unittest discover -s native/Tests -p test_smoke_macos_budget.py
      - name: Verify private live upload telemetry and streamed byte accounting
        run: python -B -m unittest discover -s native/Tests -p test_upload_progress.py
      - name: Verify bounded retries, credential renewal and private failure records
        run: python -B -m unittest discover -s native/Tests -p test_transfer_reliability.py
      - name: Verify read-only workspace drives and private extension transport
        run: python -B -m unittest native.Tests.test_workspace_mount native.Tests.test_native_bridge native.Tests.test_extension_packages
      - run: python -m unittest discover -s native/Tests -p test_library_metadata.py
        env:
          PYTHONPATH: native/Resources
      - name: Verify virtual folders and immutable archive identity during restore
        run: python -B -m unittest discover -s native/Tests -p test_library_tree.py
      - name: Verify read-only Darwin filesystem inventory and failure handling
        run: python -m unittest discover -s native/Tests -p test_darwin_mount_inventory.py
      - run: python native/Tests/stress_native.py
      - name: Test Mac notarization guardrails without Apple credentials
        run: python -m unittest discover -s native/Tests -p test_notarize_macos.py
      - name: Verify the Mac installer and reference update helpers
        run: python -m unittest discover -s macos/tests -p 'test_*.py'

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/Backend/package-lock.json
      - name: Install the real transfer-router fixture dependencies
        run: npm ci --ignore-scripts
        working-directory: native/Backend
      - name: Check protocol integration prerequisites
        run: node -e "require('./native/Backend/test_helpers/transfer_fixture')"
      - name: Test native lifecycle, archive security and the real v3 transfer router
        run: python -m unittest discover -s native/Desktop/tests -p test_desktop.py -v
      - name: Install only the desktop test and packaging dependencies
        run: |
          python -B -m pip install --only-binary=:all: -r native/Desktop/requirements.txt -r native/Desktop/requirements-build.txt
      - name: Verify actual same-user companion IPC and access restrictions
        run: python -B -m unittest discover -s native/Desktop/tests -p test_companion_server.py -v
      - name: Stage the hash-pinned compiled platform runtime without private source checkout
        run: python -B native/Desktop/stage_runtime.py --destination "${{ runner.temp }}/gendragoon-desktop" --prebuilt "native/Desktop/runtimes/${{ runner.os == 'Windows' && 'windows' || 'linux' }}-x86_64.zip"
      - name: Verify current MachineNotes, portable vault, genuine encrypted transfer, renewal and private filesystem
        run: python -B -m unittest discover -s native/Desktop/tests -p test_machinenotes.py -v
        env:
          GD_DESKTOP_RUNTIME: ${{ runner.temp }}/gendragoon-desktop
      - name: Construct the actual Linux Files and Teams GUI in an isolated profile
        if: runner.os == 'Linux'
        run: xvfb-run -a python -B -m unittest discover -s native/Desktop/tests -p test_gui_startup.py -v
        env:
          GD_DESKTOP_RUNTIME: ${{ runner.temp }}/gendragoon-desktop
      - name: Construct the actual Windows Files and Teams GUI in an isolated profile
        if: runner.os == 'Windows'
        run: python -B -m unittest discover -s native/Desktop/tests -p test_gui_startup.py -v
        env:
          GD_DESKTOP_RUNTIME: ${{ runner.temp }}/gendragoon-desktop
      - name: Build and smoke-check standalone GUI and native messaging candidates
        run: python -B native/Desktop/package_desktop.py --runtime "${{ runner.temp }}/gendragoon-desktop" --output "${{ runner.temp }}/gendragoon-candidates"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: GenDragoon-desktop-${{ runner.os }}-candidate
          path: ${{ runner.temp }}/gendragoon-candidates/*.zip
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native/Backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/Backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify Red-XAI subscription billing, workspace deletion and enforced transfer tiers
        run: node --test --test-concurrency=2 ../RedXCloud/test/*.test.cjs
      - name: Verify text-only peer sessions and browser/editor clients
        run: node --test ../Collaboration/tests/*.test.cjs ../Extensions/tests/*.test.cjs
      - name: Package Chrome, Edge, Firefox, Opera and VS Code extensions
        run: python3 -B ../Extensions/package_extensions.py --output ../../build/extensions
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: GenDragoon-extension-candidates
          path: build/extensions
          if-no-files-found: error
      - run: npm audit --omit=dev --audit-level=high
      - run: python3 -m unittest discover -p 'test_*.py'

  macos-compile:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compile all active native sources
        run: xcrun swiftc -parse-as-library -target arm64-apple-macosx14.0 -framework SwiftUI -framework AppKit -o "$RUNNER_TEMP/GenDragoon" native/Sources/*.swift
      - name: Preserve compiled Mac preview binary for isolated local verification
        uses: actions/upload-artifact@v4
        with:
          name: gendragoon-redx-preview-unsigned-macos-arm64
          path: ${{ runner.temp }}/GenDragoon
          retention-days: 3
          if-no-files-found: error
      - name: Execute native update activity and shared transfer budget regressions
        run: python3 -B -m unittest native.Tests.test_integrated_update_activity native.Tests.test_integrated_transfer_budget -v
      - name: Exercise actual Swift helper completion, failure, timeout and caller cancellation
        run: python3 -B -m unittest native.Tests.test_integrated_native_helper -v
      - name: Exercise real inherited-socket credential renewal across nested helpers
        run: python3 -B -m unittest native.Tests.test_auth_channel -v
      - name: Exercise the actual private Swift companion listener and concurrent framed requests
        run: python3 -B -m unittest native.Tests.test_companion_ipc -v
      - name: Verify portable vault encryption, account binding and safe key import
        run: python3 -B -m unittest native.Tests.test_portable_vault -v

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          gradle-version: '8.13'
      - name: Validate the pinned compiled-only runtime and owner archive adapter
        run: |
          python3.13 -B sync_runtime.py
          python3.13 -B -m unittest discover -s tests -p 'test_*.py' -v
        working-directory: native/Mobile/Android
      - name: Compile Android and run lint and unit tests
        id: android-build
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:lint :app:testDebugUnitTest --no-daemon --console=plain --stacktrace
        working-directory: native/Mobile/Android
      - name: Enable hardware acceleration for bounded Android fixtures
        if: ${{ !cancelled() && steps.android-build.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the actual packaged codec, encrypted graph and vault on Android 4 KiB
        if: ${{ !cancelled() && steps.android-build.outcome == 'success' }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        timeout-minutes: 15
        with:
          working-directory: native/Mobile/Android
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = 4096
            timeout 10m gradle :app:connectedDebugAndroidTest --no-daemon --console=plain --stacktrace
            mkdir -p app/build/reports/instrumentation-4096
            cp -R app/build/outputs/androidTest-results app/build/reports/instrumentation-4096/
      - name: Require every packaged native dependency to support 16 KiB pages
        if: ${{ !cancelled() && steps.android-build.outcome == 'success' }}
        working-directory: native/Mobile/Android
        run: python3.13 -B check_native_pages.py app/build/outputs/apk/debug/app-debug.apk --output app/build/reports/native-pages.json
      - name: Verify the actual packaged runtime on the 16 KiB Android image
        if: ${{ !cancelled() && steps.android-build.outcome == 'success' }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        timeout-minutes: 15
        with:
          working-directory: native/Mobile/Android
          api-level: 35
          target: google_apis_playstore_ps16k
          arch: x86_64
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = 16384
            timeout 10m gradle :app:connectedDebugAndroidTest --rerun-tasks --no-daemon --console=plain --stacktrace
            mkdir -p app/build/reports/instrumentation-16384
            cp -R app/build/outputs/androidTest-results app/build/reports/instrumentation-16384/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && steps.android-build.outcome != 'skipped' }}
        with:
          name: Android-unsigned-candidates-and-validation
          path: |
            native/Mobile/Android/app/build/outputs/apk/**/*.apk
            native/Mobile/Android/app/build/outputs/bundle/**/*.aab
            native/Mobile/Android/app/build/reports/
          if-no-files-found: error
          retention-days: 7

  ios:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_ios }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Choose an available iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device.get("name",""):
                      print(f"udid={device['udid']}")
                      print(f"name={device['name']}")
                      sys.exit(0)
          sys.exit("no available iPhone simulator")
          PY
      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('native/Mobile/iOS/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project native/Mobile/iOS/GenDragoonMobile.xcodeproj -scheme GenDragoonMobile -derivedDataPath "$RUNNER_TEMP/GenDragoon-iOS"
      - name: Test iOS Simulator client
        env:
          IOS_SCREENSHOT_DIR: ${{ github.workspace }}/ios-screenshots
          TEST_RUNNER_IOS_SCREENSHOT_DIR: ${{ github.workspace }}/ios-screenshots
        run: xcodebuild test -project native/Mobile/iOS/GenDragoonMobile.xcodeproj -scheme GenDragoonMobile -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" -derivedDataPath "$RUNNER_TEMP/GenDragoon-iOS" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGNING_REQUIRED=YES AD_HOC_CODE_SIGNING_ALLOWED=YES ONLY_ACTIVE_ARCH=YES SWIFT_ENABLE_EXPLICIT_MODULES=NO
      - name: Collect simulator screenshots
        if: always()
        run: |
          mkdir -p ios-screenshots
          if [ -d /tmp/ios-screenshots ]; then cp -R /tmp/ios-screenshots/. ios-screenshots/; fi
          find ios-screenshots -name '*.png' | grep -q .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ios-simulator-screenshots
          path: ios-screenshots
          if-no-files-found: error
          retention-days: 7
