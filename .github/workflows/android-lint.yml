name: Android lint

on:
  push:
    paths:
      - 'native/Mobile/Android/**'
      - '.github/workflows/android-lint.yml'
  pull_request:
    paths:
      - 'native/Mobile/Android/**'
      - '.github/workflows/android-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/Mobile/Android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - name: Lint and unit tests
        run: ./gradlew lint testDebugUnitTest --no-daemon --console=plain --stacktrace
