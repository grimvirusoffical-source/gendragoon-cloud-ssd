name: Actual extension host acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/Extensions/**'
      - 'native/Collaboration/**'
      - 'native/Resources/gendragoon_native_bridge.py'
      - 'native/Resources/gendragoon_platform_ipc.py'
      - 'native/Desktop/companion_server.py'
      - 'native/Desktop/native_host_entry.py'
      - 'native/Desktop/build_native_host.py'
      - 'native/Tests/ExtensionAcceptance/**'
      - '.github/workflows/extension-acceptance.yml'
  pull_request:
    paths:
      - 'native/Extensions/**'
      - 'native/Collaboration/**'
      - 'native/Resources/gendragoon_native_bridge.py'
      - 'native/Resources/gendragoon_platform_ipc.py'
      - 'native/Desktop/companion_server.py'
      - 'native/Desktop/native_host_entry.py'
      - 'native/Desktop/build_native_host.py'
      - 'native/Tests/ExtensionAcceptance/**'
      - '.github/workflows/extension-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: extension-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actual-client:
    name: Actual ${{ matrix.client }} loading
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        client: [chromium, chrome, edge, opera, vscode, firefox]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Prepare a separate locked tool directory without modifying extension packages
        env:
          GD_EXTENSION_TEST_TOOLS: ${{ runner.temp }}/gd-extension-tools
          GD_EXTENSION_ACCEPTANCE_ROOT: ${{ runner.temp }}/gdx-${{ matrix.client }}
          GD_EXTENSION_NATIVE_HOST: ${{ runner.temp }}/gd-native-host/GenDragoonNativeHost
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/gd-extension-browsers
        run: |
          mkdir -m 700 "$GD_EXTENSION_TEST_TOOLS"
          cp native/Tests/ExtensionAcceptance/package.json native/Tests/ExtensionAcceptance/package-lock.json "$GD_EXTENSION_TEST_TOOLS/"
          printf 'GD_EXTENSION_TEST_TOOLS=%s\n' "$GD_EXTENSION_TEST_TOOLS" >> "$GITHUB_ENV"
          printf 'GD_EXTENSION_ACCEPTANCE_ROOT=%s\n' "$GD_EXTENSION_ACCEPTANCE_ROOT" >> "$GITHUB_ENV"
          printf 'GD_EXTENSION_NATIVE_HOST=%s\n' "$GD_EXTENSION_NATIVE_HOST" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          echo "GD_EXTENSION_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Install the integrity-locked test APIs without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ${{ runner.temp }}/gd-extension-tools
      - name: Install official browser runtime and Linux dependencies
        if: matrix.client == 'chromium' || matrix.client == 'firefox'
        run: node node_modules/playwright/cli.js install --with-deps ${{ matrix.client == 'chromium' && 'chromium' || 'firefox' }}
        working-directory: ${{ runner.temp }}/gd-extension-tools
      - name: Prepare Linux Electron system libraries
        if: matrix.client == 'vscode' || matrix.client == 'chrome' || matrix.client == 'edge' || matrix.client == 'opera'
        run: node node_modules/playwright/cli.js install-deps chromium
        working-directory: ${{ runner.temp }}/gd-extension-tools
      - name: Require the actual vendor browser already installed on the official runner
        if: matrix.client == 'chrome' || matrix.client == 'edge'
        env:
          GD_BROWSER_BRAND: ${{ matrix.client }}
        run: |
          if [ "$GD_BROWSER_BRAND" = chrome ]; then
            command -v google-chrome
            google-chrome --version
          else
            command -v microsoft-edge
            microsoft-edge --version
          fi
      - name: Stage only the checksum-pinned official Opera package in the disposable runner
        if: matrix.client == 'opera'
        run: python -B native/Tests/ExtensionAcceptance/stage_ci_opera.py --destination "$RUNNER_TEMP/gd-opera-fixture"
      - name: Supply Opera's normal desktop settings schema from the official Ubuntu repository
        if: matrix.client == 'opera'
        run: sudo apt-get install --yes --no-install-recommends gsettings-desktop-schemas
      - name: Build the actual first-party ELF native messaging host
        if: matrix.client != 'firefox'
        run: |
          python -B -m pip install --only-binary=:all: -r native/Desktop/requirements-build.txt
          python -B native/Desktop/build_native_host.py --destination "$RUNNER_TEMP/gd-native-host"
      - name: Load the real packaged client and verify its declared boundary
        env:
          GD_BROWSER_CLIENT: ${{ matrix.client }}
        run: |
          if [ "$GD_BROWSER_CLIENT" = opera ]; then
            dbus-run-session -- xvfb-run -a node native/Tests/ExtensionAcceptance/run.cjs "$GD_BROWSER_CLIENT"
          else
            xvfb-run -a node native/Tests/ExtensionAcceptance/run.cjs "$GD_BROWSER_CLIENT"
          fi
      - name: Preserve only sanitized fixture reports and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: GenDragoon-extension-${{ matrix.client }}-acceptance
          path: ${{ runner.temp }}/gdx-${{ matrix.client }}/reports/
          if-no-files-found: warn
          retention-days: 7
